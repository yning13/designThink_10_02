<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行事曆｜個人行程與任務管理</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--paper:#fff;--ink:#20293a;--muted:#788397;--line:#e8edf4;--blue:#5669d8;--soft:#eef0ff;font-family:"Segoe UI","Noto Sans TC",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}
.shell{width:min(1080px,calc(100% - 36px));margin:auto;padding:40px 0 60px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}h1{margin:0;font-size:2.5rem}.eyebrow{color:var(--blue);font-size:.78rem;letter-spacing:.12em;font-weight:bold}.sub,.note{color:var(--muted)}.date{padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}.date span{display:block;color:var(--muted);font-size:.8rem}.date strong{display:block;margin-top:4px}
.columns{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:20px}.panel{min-width:0;padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 10px 28px #23314d0c}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h2{margin:0;font-size:1.15rem}.note{font-size:.85rem;margin:5px 0 0}.badge{flex:none;padding:6px 10px;border-radius:9px;background:var(--soft);color:var(--blue)}
.list{display:grid;gap:10px}.event{display:grid;grid-template-columns:60px 3px minmax(0,1fr) auto;gap:12px;align-items:center;min-width:0;padding:13px;border:1px solid var(--line);border-radius:13px}.time{color:var(--blue);font-weight:700;white-space:nowrap}.mark{height:40px;width:3px;border-radius:4px;background:var(--blue)}.event:nth-child(2) .mark{background:#51a68e}.event:nth-child(3) .mark{background:#e6a54f}h3{font-size:.94rem;margin:0;overflow-wrap:anywhere}.detail{margin:5px 0 0;color:var(--muted);font-size:.81rem;overflow-wrap:anywhere}.tag{padding:5px 9px;background:var(--soft);color:var(--blue);border-radius:20px;font-size:.73rem;white-space:nowrap}
.task{display:flex;gap:12px;align-items:flex-start;padding:14px 2px;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{flex:none;width:18px;height:18px;margin:2px 0 0;accent-color:var(--blue)}.task-meta{display:block;margin-top:5px;color:var(--muted);font-size:.8rem}
.form-panel{margin-top:20px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:grid;gap:7px;min-width:0}.full{grid-column:1/-1}.field label{font-size:.84rem;font-weight:650}.field input,.field select,.field textarea{width:100%;min-width:0;padding:11px;border:1px solid #dfe5ee;border-radius:9px;background:white}.field textarea{min-height:75px;resize:vertical}.actions{display:flex;justify-content:flex-end;margin-top:16px}.submit{padding:11px 17px;border:0;border-radius:9px;background:var(--blue);color:#fff;cursor:pointer}.footnote{font-size:.8rem;color:var(--muted)}
@media(max-width:760px){.columns{grid-template-columns:minmax(0,1fr)}.shell{width:min(100% - 28px,600px);padding-top:28px}}
@media(max-width:480px){.shell{width:calc(100% - 24px);padding-top:22px}.head{align-items:stretch;flex-direction:column;gap:12px}.date{display:flex;justify-content:space-between;align-items:center}.date strong{margin:0}.panel{padding:16px}.event{grid-template-columns:48px 3px minmax(0,1fr);gap:9px;padding:11px 9px}.event .tag{grid-column:3;justify-self:start}.time{font-size:.82rem}.form-grid{grid-template-columns:minmax(0,1fr)}.full{grid-column:auto}}
</style>
</head>
<body>
<main class="shell">
<header class="head"><div><p class="eyebrow">PERSONAL PLANNER</p><h1>行事曆</h1><p class="sub">安排今天的步調，讓每件事都更有條理。</p></div><div class="date"><span>今天</span><strong id="todayDate">載入日期中…</strong></div></header>
<div class="columns">
<section class="panel" aria-labelledby="scheduleHeading"><div class="panel-title"><div><h2 id="scheduleHeading">今日行程</h2><p class="note">今天預定的三項安排</p></div><span class="badge">3</span></div><div class="list">
<article class="event"><time class="time">09:00</time><i class="mark" aria-hidden="true"></i><div><h3>晨間規劃與閱讀</h3><p class="detail">在家 · 整理本週重點</p></div><span class="tag">個人</span></article>
<article class="event"><time class="time">13:30</time><i class="mark" aria-hidden="true"></i><div><h3>專案進度討論</h3><p class="detail">會議室 A · 設計小組</p></div><span class="tag">工作</span></article>
<article class="event"><time class="time">18:00</time><i class="mark" aria-hidden="true"></i><div><h3>晚餐與朋友聚會</h3><p class="detail">市區 · 記得預留交通時間</p></div><span class="tag">生活</span></article>
</div></section></div>
<div class="columns">
<section class="panel" aria-labelledby="tasksHeading"><div class="panel-title"><div><h2 id="tasksHeading">待辦事項</h2><p class="note">完成後勾選，追蹤處理狀態</p></div><span class="badge">3</span></div>
<label class="task"><input type="checkbox"><span>整理會議資料<span class="task-meta">重要 · 上午前</span></span></label>
<label class="task"><input type="checkbox"><span>回覆合作夥伴郵件<span class="task-meta">工作 · 今天</span></span></label>
<label class="task"><input type="checkbox"><span>採買日常用品<span class="task-meta">生活 · 下班後</span></span></label>
</section>
<section class="panel form-panel" aria-labelledby="formHeading"><div class="panel-title"><div><h2 id="formHeading">新增行程</h2><p class="note">填寫欄位以規劃新的安排</p></div></div>
<form><div class="form-grid">
<div class="field full"><label for="title">行程名稱</label><input id="title" type="text" placeholder="例如：團隊週會"></div>
<div class="field"><label for="date">日期</label><input id="date" type="date"></div>
<div class="field"><label for="category">行程類別</label><select id="category"><option value="">請選擇類別</option><option>工作</option><option>個人</option><option>生活</option></select></div>
<div class="field"><label for="start">開始時間</label><input id="start" type="time"></div>
<div class="field"><label for="end">結束時間</label><input id="end" type="time"></div>
<div class="field full"><label for="location">地點</label><input id="location" type="text" placeholder="輸入地點（選填）"></div>
<div class="field full"><label for="notes">備註</label><textarea id="notes" placeholder="補充說明（選填）"></textarea></div>
</div><div class="actions"><button class="submit" type="button">＋ 新增行程</button></div><p class="footnote">靜態畫面框架：表單按鈕僅呈現外觀，不會送出或儲存資料。</p></form></section></div>
</main>
<script>
// 顯示裝置的今天日期；不連線、不儲存資料。
document.getElementById('todayDate').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());
</script>
</body>
</html>
